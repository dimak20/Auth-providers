services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: "on-failure"
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  # local S3-compatible storage (SeaweedFS: master + volume + filer + S3 gateway in one container)
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: s3
    restart: "on-failure"
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API (presigned URLs from the browser go here)
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - app

  # one-shot: waits for the S3 API, creates the bucket and its CORS rules, exits
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: ${S3__ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3__SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3__REGION}
    volumes:
      - ./seaweedfs/cors.json:/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do aws --endpoint-url http://s3:8333 s3 ls >/dev/null 2>&1 && break; sleep 2; done;
      aws --endpoint-url http://s3:8333 s3 mb s3://$${S3__BUCKET} 2>/dev/null || true;
      aws --endpoint-url http://s3:8333 s3api put-bucket-cors --bucket $${S3__BUCKET} --cors-configuration file:///cors.json || true;
      aws --endpoint-url http://s3:8333 s3 ls
      "
    networks:
      - app

  redis:
    image: valkey/valkey:8
    container_name: redis
    restart: "on-failure"
    ports:
      - "6379:6379"
    networks:
      - app
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:18
    restart: "on-failure"
    container_name: db
    ports:
      - "5432:5432"
    volumes:
      - postgresauthappdata:/var/lib/postgresql
    env_file:
      - .env
    networks:
      - app
    command: >
      postgres
      -c max_connections=3500
      -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - keycloakdata:/opt/keycloak/data
    networks:
      - app

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    networks:
      - app



networks:
  app:
    driver: bridge
volumes:
  postgresauthappdata:
  keycloakdata:
  s3data:
