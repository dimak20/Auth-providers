[project]
name = "auth-providers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.44.3",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.2",
    "gunicorn>=26.2.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "psycopg-binary>=3.3.8",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
    "uvicorn-worker>=0.4.0",
]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]
